<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Notes App</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="app">
      <!-- Header -->
      <header class="header">
        <div>
          <h1>My Notes</h1>
          <p>Capture your thoughts and ideas.</p>
        </div>

        <button class="add-btn" id="addNoteBtn">+ Add Note</button>
      </header>

      <!-- Search -->
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search notes..." />
      </div>

      <!-- Notes -->
      <main>
        <div class="notes-header">
          <h2>All Notes</h2>
          <span id="notesCount">0 notes</span>
        </div>

        <div class="notes-container" id="notesContainer">
          <!-- Notes will be added using JavaScript -->
          div //title - JavaScript project creation in cclass //content - what
          -> how -> why div // btn - delete
        </div>
      </main>
    </div>

    <!-- Add / Edit Note Modal -->
    <div class="modal hidden" id="noteModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Create Note</h2>

          <button class="close-btn" id="closeModalBtn" type="button">
            &times;
          </button>
        </div>

        <form id="noteForm">
          <div class="form-group">
            <label for="noteTitle"> Title </label>

            <input
              type="text"
              id="noteTitle"
              placeholder="Enter note title"
              required
            />
          </div>

          <div class="form-group">
            <label for="noteContent"> Content </label>

            <textarea
              id="noteContent"
              rows="7"
              placeholder="Write your note..."
              required
            ></textarea>
          </div>

          <div class="form-actions">
            <!-- <button type="button" class="cancel-btn" id="cancelBtn">
              Cancel
            </button> -->

            <button type="submit" class="save-btn">Save Note</button>
          </div>
        </form>
      </div>
    </div>

    <script src="project.js"></script>
  </body>
</html>
